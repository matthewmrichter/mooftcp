# Release switches shared by scripts/release.sh and scripts/relverify.py (one definition).
# DIAGLOG_TEXT: 1 = the "REPORTING PROBLEMS" block of docs/release/ReadMe.txt (between the
# [BEGIN/END DIAGNOSTIC LOG TEXT] marker lines) ships, with the marker lines removed; 0 = the whole
# block, marker lines included, is removed. It describes the control panel checkbox "Keep a diagnostic
# log", so Task 11b flips this to 1 in the same commit that adds the checkbox.
DIAGLOG_TEXT=0
